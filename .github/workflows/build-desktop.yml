name: Build KiteGrams desktop

# Сборка ПК-клиента KiteGrams (Windows x64) на базе `iamxvbaba/gramsrv-tdesktop`.
#
# Почему эта база, а не форк owpenGram
# ------------------------------------
# `gramsrv-tdesktop` — форк официального tdesktop (7.3.1), подогнанный под наш
# серверный стек: в `gramsrv-main/internal/compat/tdesktop/` лежит слой
# совместимости по проводу, а `cmd/telesrv-update` умеет отдавать обновления по
# протоколу самого TDesktop (`/current4`). Сервер рассчитан именно на него.
#
# Клиент отличается от официального Telegram тремя вещами:
#   * адрес DC (`Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp`);
#   * публичный RSA-ключ сервера — он подставляется на этой сборке из
#     `/owpengram/server-info`, потому что создаётся при первом старте сервера;
#   * брендинг (имя, AUMID, имя exe, ресурсы) — overlay из `files/`.
#
# Почему свой воркфлоу, а не родной CI форка
# ------------------------------------------
# Родной Windows-джоб в `.github/workflows/canary.yml` требует раннеров Depot
# (`depot-windows-latest-32`) — это платный внешний сервис. Здесь то же самое
# на штатном `windows-2022`, плюс наши шаги: overlay, вшивание ключа, проверка
# брендинга и упаковка переносимой сборки.
#
# Почему `windows-2022`, а не `windows-latest`
# --------------------------------------------
# `windows-latest`/`windows-2025` — это Visual Studio 2026 (VS 18), где не
# установлен компонент ATL. Он нужен стадии `Libraries/breakpad` в
# Release-конфигурации: `dump_syms.vcxproj` тянет `common_windows_lib.vcxproj`,
# а тот включает `atlbase.h`. В образе `windows-2022` живёт VS 2022 17.14 с
# ATL и SDK 10.0.26100.0 — ровно то, что требует `docs/building-win.md`.
#
# Почему `DESKTOP_APP_DISABLE_AUTOUPDATE=ON`
# ------------------------------------------
# Это и есть ответ на «чтобы запускался всегда KiteGrams, а не обычный
# Telegram». TDesktop берёт адрес автообновления из `help.getConfig`
# (`autoupdate_url_prefix`), а если сервер его не прислал — из
# `storage/localstorage.cpp`, где по умолчанию стоит `https://td.telegram.org`.
# То есть собранный клиент скачал бы и поставил себе официальный Telegram.
# С `=ON` весь `UpdateChecker` вырезается препроцессором (`TDESKTOP_DISABLE_
# AUTOUPDATE`), цель `Updater` не создаётся вовсе, и подменить наш exe некому.
# Дополнительно в overlay подменён сам запасной адрес — на случай, если
# автообновление когда-нибудь включат обратно.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Конфигурация сборки"
        type: choice
        options: ["Release", "Debug"]
        default: "Release"
      parallel:
        description: "Сколько файлов компилировать одновременно. 2 — безопасно (Release упирается в память компилятора), 4 — быстро, но на qrc_emoji_*.cpp ловится C1060 out of heap space"
        type: choice
        options: ["2", "3", "4"]
        default: "2"

env:
  # База. Коммит закреплён: overlay снят ровно с этого дерева, а ветка `dev`
  # живёт своей жизнью (там мержится upstream telegramdesktop/tdesktop).
  UPSTREAM_REPO: iamxvbaba/gramsrv-tdesktop
  UPSTREAM_REF: 270f160c6e5289a33a75b4e1290103fc1cecdd60

  # Наш сервер. Ключ тянется с /owpengram/server-info (его отдаёт сам telesrv на
  # MTProto-порту), адрес DC — из overlay.
  SERVER_INFO_URL: "http://2.26.81.165:2398/owpengram/server-info"
  APP_SERVER_HOST: "2.26.81.165"
  APP_SERVER_PORT: "2398"

  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

  # Наши скрипты печатают по-русски, а stdout раннера Windows — cp1252.
  # Без этого шаг с ключом падал уже ПОСЛЕ успешного запроса:
  #   UnicodeEncodeError: 'charmap' codec can't encode characters in position 0-5
  # Скрипты дополнительно переключают поток сами, это вторая страховка.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

  # Креды приложения. Это публичные тестовые креды tdesktop
  # (`TDESKTOP_API_TEST` в `Telegram/cmake/telegram_options.cmake`); своего
  # приложения у KiteGrams нет. С ними сервер работает: он не сверяет api_id.
  APP_API_ID: "17349"
  APP_API_HASH: "344583e45741c457fe1862106095a5eb"

jobs:

  windows:
    name: Windows x64
    runs-on: windows-2022
    # Стадия Libraries на холодном кэше ~40 минут, дальше Qt и сама сборка.
    # Потолок GitHub — 6 часов, берём 5:50.
    timeout-minutes: 350

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: |
          # Имя каталога для клона базы. Короткое имя — не косметика: внутри
          # подмодуля `range-v3/doc/gh-pages` лежат сгенерированные doxygen-файлы
          # с именами под 130 символов, и при длинном пути git падает на
          # checkout с `Filename too long`. `src` экономит 23 символа (имя
          # репозитория встречается в пути трижды).
          echo "REPO_NAME=src" >> $GITHUB_ENV

      - name: Enable long paths.
        # Вторая страховка к короткому имени: `core.longpaths` заставляет
        # Git for Windows работать через `\\?\`-пути. Должно стоять до клонов.
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout this repository (overlay and scripts).
        uses: actions/checkout@v7

      - name: Clone the base.
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Apply the KiteGrams overlay.
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/TBuild/$REPO_NAME"
          test -d "$DEST/Telegram" || { echo "нет дерева исходников в $DEST" >&2; exit 1; }
          test -d files || { echo "нет каталога files/ с overlay" >&2; exit 1; }

          copied=0
          while IFS= read -r -d '' src; do
            rel="${src#files/}"
            mkdir -p "$DEST/$(dirname "$rel")"
            cp "$src" "$DEST/$rel"
            copied=$((copied + 1))
          done < <(find files -type f -print0)

          echo "скопировано файлов overlay: $copied"
          if [ "$copied" -lt 10 ]; then
            echo "подозрительно мало файлов в overlay — ожидалось 13" >&2
            exit 1
          fi

      - name: Fetch the server RSA key.
        shell: bash
        run: |
          set -euo pipefail
          # Ключ создаётся при первом старте сервера и в репозитории лежать не
          # может: собрать клиент с чужим ключом хуже, чем не собрать вовсе.
          python scripts/bake_server_key.py \
            --url "$SERVER_INFO_URL" --out server-rsa-public.pem

      - name: Bake the key into the client.
        shell: bash
        run: |
          set -euo pipefail
          python scripts/set_server_key.py \
            --source "$GITHUB_WORKSPACE/TBuild/$REPO_NAME/Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp" \
            --pem server-rsa-public.pem

      - name: Verify branding, address and key.
        shell: bash
        run: |
          set -uo pipefail
          SRC="$GITHUB_WORKSPACE/TBuild/$REPO_NAME"
          VERSION="$SRC/Telegram/SourceFiles/core/version.h"
          DCOPT="$SRC/Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp"
          CML="$SRC/Telegram/CMakeLists.txt"
          AUMID="$SRC/Telegram/SourceFiles/platform/win/windows_app_user_model_id.cpp"
          fail=0

          want() {  # want <описание> <файл> <regex> <есть|нет>
            local what="$1" file="$2" pattern="$3" expect="$4" got="нет"
            grep -qE "$pattern" "$file" && got="есть"
            if [ "$got" = "$expect" ]; then
              echo "  ok    $what"
            else
              echo "  FAIL  $what — ожидалось '$expect', получено '$got'" >&2
              fail=1
            fi
          }

          want "имя приложения"          "$VERSION" 'AppName = "KiteGrams Desktop"'      "есть"
          want "имя exe"                 "$CML"     'set\(output_name "KiteGrams"\)'      "есть"
          want "AUMID"                   "$AUMID"   'KiteGrams\.KiteGramsDesktop'         "есть"
          want "наш адрес DC"            "$DCOPT"   "\"$APP_SERVER_HOST\", $APP_SERVER_PORT" "есть"
          want "нет адресов Telegram"    "$DCOPT"   '149\.154\.1[0-9][0-9]\.'             "нет"
          want "нет автообновления с td.telegram.org" \
                                         "$SRC/Telegram/SourceFiles/storage/localstorage.cpp" \
                                                   'td\.telegram\.org'                 "нет"

          # Ключ должен совпасть с тем, что отдал сервер: иначе рукопожатие
          # провалится и клиент повиснет на «Connecting…».
          if python scripts/set_server_key.py --source "$DCOPT" \
               --pem server-rsa-public.pem --check; then
            echo "  ok    RSA-ключ совпадает с сервером"
          else
            echo "  FAIL  RSA-ключ не совпадает с сервером" >&2
            fail=1
          fi

          # prepare.py в этой базе уже с upstream-фиксом стадии ffmpeg. Проверяем
          # это явно: если фикс откатят, сборка умрёт через 40 минут на
          # `[25/32](Libraries/ffmpeg): FAILED`, и лучше узнать об этом сразу.
          PREP="$SRC/$PREPARE_PATH"
          if grep -q 'bash --login ../patches/build_ffmpeg_win.sh' "$PREP" \
             && ! grep -q 'VCToolsInstallDir' "$PREP"; then
            echo "  ok    стадия ffmpeg в prepare.py как в upstream"
          else
            echo "  FAIL  prepare.py откатился к сломанной стадии ffmpeg" >&2
            fail=1
          fi

          [ "$fail" = 0 ] || exit 1
          echo "брендинг, адрес и ключ на месте."

      # Qt 6.11 падает на `mocs_compilation_RelWithDebInfo.cpp` с
      # `fatal error C1083: Cannot open compiler generated file: ''`: стадия
      # собирает Qt с `-force-debug-info`, а на этой связке (Qt 6.11.2 +
      # MSVC 14.44 + Ninja) PDB для `qtmultimedia` не заводится. Пробовали
      # явный ProgramDatabase — `/Fd` стал корректным, ошибка осталась:
      # путь относительный (`qtbase\lib\...`), каталога ещё нет.
      # Поэтому просто убираем `-force-debug-info`: Qt собирается обычным
      # Release без /Zi и /Fd, символы Qt нам не нужны (crash reports off).
      # Патч меняет prepare.py до Libraries, поэтому хэш кэша (шаг ниже)
      # считается уже по исправленному файлу.
      - name: Patch prepare.py (no Qt debug info).
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/TBuild/$REPO_NAME"
          PREP="$SRC/$PREPARE_PATH"
          python scripts/patch_prepare_qt_pdb.py "$PREP"
          if grep -q 'force-debug-info' "$PREP"; then
            echo "FAIL: -force-debug-info остался в prepare.py" >&2
            exit 1
          fi
          echo "Qt собирается без debug info."

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Ключ кэша библиотек: меняется при правке prepare.py или SDK.
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Check ATL availability.
        # `windows-latest` уже переезжал на VS 2026, где ATL не установлен, и
        # сборка гибла на 27-й стадии из 32 через 40 минут после старта:
        #   error C1083: Cannot open include file: 'atlbase.h'
        # Проверка стоит секунды и делает отказ мгновенным.
        #
        # Где лежит ATL — спрашиваем не у догадки, а у `vcvarsall`: он кладёт
        # каталог в `INCLUDE`, то есть ровно туда, откуда его возьмёт `cl.exe`.
        shell: bash
        run: |
          set -uo pipefail
          ATL_DIR="$(printf '%s' "${INCLUDE:-}" | tr ';' '\n' \
            | grep -i 'atlmfc' | head -1 | tr -d '\r')"
          if [ -z "$ATL_DIR" ]; then
            echo "В INCLUDE нет ATLMFC — ищу по дереву Visual Studio..." >&2
            ATL_HDR="$(find "/c/Program Files/Microsoft Visual Studio" -maxdepth 8 \
              -iname atlbase.h 2>/dev/null | head -1 || true)"
            if [ -z "$ATL_HDR" ]; then
              echo "FAIL: ATL не установлен — breakpad (Release) не соберётся." >&2
              echo "INCLUDE=${INCLUDE:-<пусто>}" >&2
              exit 1
            fi
            echo "ATL найден по дереву: $ATL_HDR"
            exit 0
          fi
          ATL_UNIX="$(cygpath -u "$ATL_DIR" 2>/dev/null || printf '%s' "$ATL_DIR")"
          for hdr in atlbase.h atlcomcli.h; do
            if [ ! -f "$ATL_UNIX/$hdr" ]; then
              echo "FAIL: нет $hdr в $ATL_DIR — breakpad (Release) не соберётся." >&2
              exit 1
            fi
          done
          echo "ATL найден: $ATL_DIR"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Choose prepare options.
        shell: bash
        run: |
          set -euo pipefail
          # `skip-release` пропускает в prepare.py ВСЕ команды со scope `release:`
          # — в частности `ninja -C out/Release_x64` в breakpad. Родной canary
          # форка собирает библиотеки без skip-release, и нам Release нужен:
          # Debug требует отладочный CRT (MSVCP140D.dll и К°), который нельзя
          # распространять.
          #
          # Цена: библиотеки собираются в двух конфигурациях — времени и диска
          # примерно вдвое больше.
          if [ "${{ inputs.build_type }}" = "Debug" ]; then
            echo "PREPARE_OPTS=skip-release" >> $GITHUB_ENV
            echo "библиотеки: только Debug (skip-release)"
          else
            echo "PREPARE_OPTS=" >> $GITHUB_ENV
            echo "библиотеки: Debug + Release — как в canary.yml"
          fi

      - name: Disk before libraries.
        shell: bash
        run: df -h / || true

      - name: Libraries.
        # Самая долгая часть: 32 сторонние библиотеки + Qt из исходников.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat %PREPARE_OPTS% silent

      - name: Disk after libraries.
        shell: bash
        run: df -h / || true

      - name: Free up some disk space.
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          df -h / 2>/dev/null || true

      # Стадия tdesktop_rust в prepare.py заканчивается `move out\include\wallet_engine\
      # wallet_engine.cpp out\src\wallet_engine\wallet_engine.cpp`, но bindgen не всегда
      # отдаёт файл именно под этим именем, а prepare в silent-режиме ошибку глотает.
      # Тогда Configure падает на «Cannot find source file: .../wallet_engine.cpp».
      # Здесь мы это чиним: если файла нет, ищем сгенерированный .cpp рядом и кладём
      # его на место; если не нашли — падаем сразу с листингом каталогов.
      - name: Ensure wallet engine.
        shell: bash
        run: |
          set -euo pipefail
          W="$LibrariesPath/tdesktop_rust"
          TARGET="$W/out/src/wallet_engine/wallet_engine.cpp"
          if [ -f "$TARGET" ]; then
            echo "wallet_engine.cpp на месте ($(stat -c%s "$TARGET") байт)"
            exit 0
          fi
          echo "wallet_engine.cpp отсутствует — ищу сгенерированный файл"
          mkdir -p "$W/out/src/wallet_engine"
          FOUND=$(find "$W" -path '*wallet_engine*' -name '*.cpp' -type f 2>/dev/null | head -1 || true)
          if [ -z "$FOUND" ]; then
            FOUND=$(find "$W" -name '*.cpp' -type f -newer "$W/Cargo.toml" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$FOUND" ]; then
            echo "беру $FOUND"
            cp "$FOUND" "$TARGET"
            exit 0
          fi
          echo "FAIL: bindgen не оставил ни одного .cpp" >&2
          ls -la "$W/out/include/wallet_engine" 2>/dev/null || true
          ls -la "$W/out/src/wallet_engine" 2>/dev/null || true
          exit 1

      - name: Configure.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=%APP_API_ID% ^
            -D TDESKTOP_API_HASH=%APP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=${{ inputs.build_type }} ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build.
        # Параллелизм — входной параметр, по умолчанию 2: три гигантских
        # сгенерированных qrc_emoji_*.cpp (~85k строк строковых литералов)
        # компилируются одновременно, по одному cl.exe на файл, и раннер на
        # 16 ГБ ловит `error C1060: compiler is out of heap space`.
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config ${{ inputs.build_type }} --parallel ${{ inputs.parallel }}

      - name: Locate the exe.
        # Имя exe задаёт `output_name` в `Telegram/CMakeLists.txt`; overlay
        # меняет его на KiteGrams. Ищем оба варианта, чтобы при откате overlay
        # шаг не потерял уже собранный exe.
        shell: bash
        run: |
          set -euo pipefail
          OUT="$TBUILD/$REPO_NAME/out/${{ inputs.build_type }}"
          EXE=$(find "$OUT" -maxdepth 2 -name 'KiteGrams.exe' -print -quit || true)
          if [ -z "$EXE" ]; then
            EXE=$(find "$OUT" -maxdepth 2 -name 'Telegram.exe' -print -quit || true)
          fi
          if [ -z "$EXE" ]; then
            echo "FAIL: не нашёл KiteGrams.exe в $OUT" >&2
            ls -la "$OUT" 2>/dev/null | head -30 >&2
            exit 1
          fi
          echo "нашёл: $EXE"
          ls -la "$EXE"
          echo "EXE=$EXE" >> $GITHUB_ENV
          echo "OUTDIR=$OUT" >> $GITHUB_ENV

      - name: Scan the exe.
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scan_exe.py "$EXE" \
            --absent 149.154. --absent td.telegram.org \
            --absent "Telegram.TelegramDesktop" \
            --present KiteGrams --present "$APP_SERVER_HOST" \
            --info Telegram

      - name: Package the portable build.
        # Переносимая сборка tdesktop — это exe плюс `d3dcompiler_47.dll`:
        # Qt и остальные библиотеки слинкованы статически (ровно так собирает
        # официальный `Telegram/build/build.bat` — 7z по папке с exe и
        # `modules\x64\d3d\`). Данные клиент хранит рядом с exe: на Windows
        # Release-сборка сначала пробует `cExeDir()` и уходит в `%APPDATA%`
        # только если папка недоступна на запись, — поэтому распакованный
        # архив живёт в своей `tdata` и с официальным Telegram не пересекается.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${EXE:-}" ] && [ -f "$EXE" ] || { echo "exe не собран"; exit 0; }
          mkdir -p artifact/KiteGrams/modules/x64/d3d

          cp "$EXE" artifact/KiteGrams/KiteGrams.exe

          D3D=$(find "$OUTDIR/modules" -name 'd3dcompiler_47.dll' -print -quit 2>/dev/null || true)
          if [ -n "$D3D" ]; then
            cp "$D3D" artifact/KiteGrams/modules/x64/d3d/d3dcompiler_47.dll
            echo "d3dcompiler_47.dll: $D3D"
          else
            echo "ВНИМАНИЕ: d3dcompiler_47.dll не найден — ANGLE может не запуститься." >&2
          fi

          # 7-Zip на образах GitHub лежит в `C:\Program Files\7-Zip`, но в PATH
          # он не всегда: официальный `build.bat` добавляет каталог руками.
          SEVENZ=$(command -v 7z || true)
          if [ -z "$SEVENZ" ]; then
            for candidate in "/c/Program Files/7-Zip/7z.exe" "/c/Program Files (x86)/7-Zip/7z.exe"; do
              [ -x "$candidate" ] && SEVENZ="$candidate" && break
            done
          fi
          if [ -z "$SEVENZ" ]; then
            echo "FAIL: не нашёл 7z — без него переносимый архив не собрать." >&2
            exit 1
          fi
          echo "7z: $SEVENZ"

          ( cd artifact \
            && "$SEVENZ" a -mx9 KiteGrams-portable-win64.zip KiteGrams > /dev/null \
            && "$SEVENZ" t KiteGrams-portable-win64.zip > /dev/null \
            && ls -la )

      - name: Collect artifacts.
        # `always()`: exe — результат сборки, а проверки выше диагностика.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ( cd artifact && sha256sum KiteGrams-portable-win64.zip KiteGrams/KiteGrams.exe \
              > SHA256SUMS.txt && cat SHA256SUMS.txt ) || true

      - name: Upload the build.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KiteGrams-desktop-${{ inputs.build_type }}-x64
          path: artifact\
          retention-days: 30
          if-no-files-found: warn
